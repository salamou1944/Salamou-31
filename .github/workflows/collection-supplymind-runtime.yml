name: Collection SupplyMind Runtime Proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/collection-supplymind-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          repository: msajja5/supplymind-sales-outreach
          ref: main
          path: _candidate/supplymind-sales-outreach
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install candidate dependencies
        working-directory: _candidate/supplymind-sales-outreach
        run: npm install --no-audit --no-fund

      - name: Apply minimal integration adapter
        working-directory: _candidate/supplymind-sales-outreach
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "src/App.tsx": [
                  ('<Generate  session={session} />', '<Generate />'),
                  ('<Contacts  session={session} />', '<Contacts />'),
                  ('<Tracker   session={session} />', '<Tracker />'),
                  ('<Settings  session={session} />', '<Settings />'),
              ],
              "src/pages/Dashboard.tsx": [
                  ('<Generate session={session} />', '<Generate />'),
              ],
              "src/tabs/Sequence.tsx": [
                  ('<OutputBox text={seq[k]} />', '<OutputBox>{seq[k]}</OutputBox>'),
              ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f"expected integration pattern missing: {name}: {old}")
                  s = s.replace(old, new)
              p.write_text(s)
          print("SUPPLYMIND_ADAPTER=APPLIED")
          PY

      - name: Typecheck candidate
        working-directory: _candidate/supplymind-sales-outreach
        run: npm run typecheck

      - name: Build candidate
        working-directory: _candidate/supplymind-sales-outreach
        run: npm run build

      - name: Verify runtime contract
        working-directory: _candidate/supplymind-sales-outreach
        run: |
          set -euo pipefail
          test -f package.json
          test -f README.md
          grep -q 'VITE_SUPABASE_URL' README.md
          grep -q 'VITE_SUPABASE_ANON_KEY' README.md
          test -d dist
          test -f dist/index.html
          echo "SUPPLYMIND_FRONTEND_RUNTIME_PROOF=PASS"

      - name: Probe remote generate-message contract
        working-directory: _candidate/supplymind-sales-outreach
        run: |
          set -euo pipefail
          SUPABASE_URL="$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.example)"
          SUPABASE_ANON_KEY="$(sed -n 's/^VITE_SUPABASE_ANON_KEY=//p' .env.example)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          set +e
          STATUS="$(curl -sS -o /tmp/generate-message-response.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/generate-message" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{"channel":"email","name":"RuntimeProbe","company":"RuntimeProbe","role":"Tester","hook":"","goal":"reply"}')"
          CURL_EXIT=$?
          set -e
          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "SUPPLYMIND_GENERATE_MESSAGE_ROUTE=UNREACHABLE_NETWORK"
            echo "SUPPLYMIND_BACKEND_E2E=BLOCKED_NETWORK_DNS"
            exit 0
          fi
          echo "GENERATE_MESSAGE_HTTP_STATUS=$STATUS"
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
            echo "SUPPLYMIND_GENERATE_MESSAGE_ROUTE=REACHABLE_AUTH_REQUIRED"
          elif [ "$STATUS" = "200" ]; then
            echo "SUPPLYMIND_GENERATE_MESSAGE_ROUTE=REACHABLE"
          elif [ "$STATUS" = "404" ]; then
            echo "SUPPLYMIND_GENERATE_MESSAGE_ROUTE=MISSING"
            exit 20
          else
            echo "SUPPLYMIND_GENERATE_MESSAGE_ROUTE=UNEXPECTED"
            cat /tmp/generate-message-response.json
            exit 21
          fi
          echo "SUPPLYMIND_BACKEND_E2E=NOT_RUN_NO_USER_SESSION"
