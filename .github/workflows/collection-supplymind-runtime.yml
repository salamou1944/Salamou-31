name: Collection SupplyMind Runtime Proof

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/collection-supplymind-runtime.yml"

permissions:
  contents: read

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          repository: msajja5/supplymind-sales-outreach
          ref: main
          path: _candidate/supplymind-sales-outreach
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install candidate dependencies
        working-directory: _candidate/supplymind-sales-outreach
        run: npm install --no-audit --no-fund

      - name: Apply minimal integration adapter
        working-directory: _candidate/supplymind-sales-outreach
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "src/App.tsx": [
                  ('<Generate  session={session} />', '<Generate />'),
                  ('<Contacts  session={session} />', '<Contacts />'),
                  ('<Tracker   session={session} />', '<Tracker />'),
                  ('<Settings  session={session} />', '<Settings />'),
              ],
              "src/pages/Dashboard.tsx": [
                  ('<Generate session={session} />', '<Generate />'),
              ],
              "src/tabs/Sequence.tsx": [
                  ('<OutputBox text={seq[k]} />', '<OutputBox>{seq[k]}</OutputBox>'),
              ],
          }
          for name, pairs in replacements.items():
              p = Path(name)
              s = p.read_text()
              for old, new in pairs:
                  if old not in s:
                      raise SystemExit(f"expected integration pattern missing: {name}: {old}")
                  s = s.replace(old, new)
              p.write_text(s)
          print("SUPPLYMIND_ADAPTER=APPLIED")
          PY

      - name: Typecheck candidate
        working-directory: _candidate/supplymind-sales-outreach
        run: npm run typecheck

      - name: Build candidate
        working-directory: _candidate/supplymind-sales-outreach
        run: npm run build

      - name: Verify runtime contract
        working-directory: _candidate/supplymind-sales-outreach
        run: |
          set -euo pipefail
          test -f package.json
          test -f README.md
          grep -q 'VITE_SUPABASE_URL' README.md
          grep -q 'VITE_SUPABASE_ANON_KEY' README.md
          test -d dist
          test -f dist/index.html
          echo "SUPPLYMIND_FRONTEND_RUNTIME_PROOF=PASS"
          echo "SUPPLYMIND_BACKEND_E2E=NOT_RUN_NO_CREDENTIALS"
