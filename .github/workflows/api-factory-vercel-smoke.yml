name: API Factory Vercel Smoke

on:
  push:
    branches:
      - feat/api-factory-railway-deployable-2026-10-16
    paths:
      - AI-API-HUB/api-factory/server.mjs
      - AI-API-HUB/api-factory/factory.mjs
      - AI-API-HUB/api-factory/provider.mjs
      - AI-API-HUB/api-factory/test-factory.mjs
      - AI-API-HUB/FREE-PROVIDER-POLICY.md
      - AI-API-HUB/free-provider-policy-fixture.json
      - AI-API-HUB/test-free-provider-policy.mjs
      - AI-API-HUB/api-factory/api/index.mjs
      - AI-API-HUB/api-factory/registry-store.mjs
      - AI-API-HUB/api-factory/artifact-store.mjs
      - AI-API-HUB/api-factory/vercel.json
      - .github/workflows/api-factory-vercel-smoke.yml
  pull_request:
    paths:
      - AI-API-HUB/api-factory/server.mjs
      - AI-API-HUB/api-factory/factory.mjs
      - AI-API-HUB/api-factory/provider.mjs
      - AI-API-HUB/api-factory/test-factory.mjs
      - AI-API-HUB/FREE-PROVIDER-POLICY.md
      - AI-API-HUB/free-provider-policy-fixture.json
      - AI-API-HUB/test-free-provider-policy.mjs
      - AI-API-HUB/api-factory/api/index.mjs
      - AI-API-HUB/api-factory/registry-store.mjs
      - AI-API-HUB/api-factory/artifact-store.mjs
      - AI-API-HUB/api-factory/vercel.json
      - .github/workflows/api-factory-vercel-smoke.yml

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl --connect-timeout 5 --max-time 10 --fail --silent --show-error https://salamou31-api-factory.vercel.app/health -o /tmp/health.json; then
              break
            fi
            sleep 10
          done
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/health.json","utf8")); if(x.ok!==true||x.service!=="api-factory") process.exit(1); console.log(JSON.stringify(x))'
      - name: Verify readiness endpoint fails closed without durable storage
        shell: bash
        run: |
          set -euo pipefail
          status=""
          for attempt in $(seq 1 12); do
            status=$(curl --connect-timeout 5 --max-time 10 --silent --show-error -o /tmp/ready.json -w '%{http_code}' https://salamou31-api-factory.vercel.app/ready || true)
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              break
            fi
            sleep 10
          done
          test -s /tmp/ready.json
          STATUS="$status" node -e '
            const x=JSON.parse(require("fs").readFileSync("/tmp/ready.json","utf8"));
            const status=process.env.STATUS;
            const durable=status==="200"&&x.checks?.registryPersistence===true&&x.checks?.artifactPersistence===true&&x.storage?.durable===true&&x.ready===true&&x.ok===true;
            const authBlocked=status==="503"&&x.ok===false&&x.ready===false&&x.code==="AUTH_CONFIGURATION_REQUIRED"&&x.checks?.authentication===false;
            const storageBlocked=status==="503"&&x.ok===false&&x.ready===false&&x.code==="DURABLE_STORAGE_REQUIRED"&&x.checks?.authentication===true&&x.checks?.registryPersistence===false&&x.checks?.artifactPersistence===false&&x.storage?.durable===false;
            if(!durable&&!authBlocked&&!storageBlocked) { console.error("Readiness contract mismatch; HTTP "+status, x); process.exit(1); }
            console.log(JSON.stringify({httpStatus:Number(status),productionReady:durable,expectedBlocker:authBlocked?"AUTH_CONFIGURATION_REQUIRED":storageBlocked?"DURABLE_STORAGE_REQUIRED":null,body:x}));
          '
      - name: Verify live capabilities and export route contract
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 5 --max-time 10 --fail --silent --show-error https://salamou31-api-factory.vercel.app/v1/factory/capabilities -o /tmp/capabilities.json
          node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/capabilities.json","utf8")); if(!x.operations?.includes("export")||x.deploymentExecutionImplemented!==false) process.exit(1); console.log("capabilities/export contract: PASS")'
      - name: Verify export route rejects unauthenticated requests
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl --connect-timeout 5 --max-time 10 --silent --show-error -o /tmp/export-unauth.json -w '%{http_code}' https://salamou31-api-factory.vercel.app/v1/factory/export/__smoke_test__ || true)
          test "$status" = "401" -o "$status" = "503"
          STATUS="$status" node -e 'const x=JSON.parse(require("fs").readFileSync("/tmp/export-unauth.json","utf8")); const status=process.env.STATUS; const authConfigured=status==="401"&&x.ok===false&&x.code==="UNAUTHORIZED"; const authMissing=status==="503"&&x.ok===false&&x.code==="AUTH_CONFIGURATION_REQUIRED"; if(!authConfigured&&!authMissing) process.exit(1); console.log(JSON.stringify({authenticationGate:"PASS",httpStatus:Number(status),code:x.code}))'
