name: SOAT Runtime Integration Smoke

on:
  push:
    branches: [main]
    paths:
      - "AI-API-HUB/api-factory/**"
      - ".github/workflows/soat-runtime-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soat-runtime-integration-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOAT_SHA: 600721c1fa30de27c14f6da5e5917049a5339036
      SOAT_DIR: /tmp/soat

    steps:
      - name: Checkout Salamou-31
        uses: actions/checkout@v4

      - name: Verify SOAT system-message request mapping
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const source = fs.readFileSync("./AI-API-HUB/api-factory/provider.mjs", "utf8");
          for (const required of [
            'const systemMessages=cfg.kind==="soat"',
            'instructions:systemMessages.map((message)=>message.content).join("\\n\\n")',
            'const requestMessages=cfg.kind==="soat"',
            'messages:requestMessages'
          ]) {
            if (!source.includes(required)) throw new Error(`Missing SOAT request mapping: ${required}`);
          }
          console.log("SOAT system-message mapping guard: OK");
          NODE

      - name: Checkout pinned SOAT
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/ttoss/soat.git "$SOAT_DIR"
          git -C "$SOAT_DIR" checkout --detach "$SOAT_SHA"
          test "$(git -C "$SOAT_DIR" rev-parse HEAD)" = "$SOAT_SHA"

      - name: Create host-port override
        shell: bash
        run: |
          cat > "$SOAT_DIR/tests/docker-compose.ci-override.yml" <<'EOF'
          services:
            server:
              ports:
                - "50477:50477"
          EOF

      - name: Start pinned SOAT runtime
        working-directory: /tmp/soat
        run: |
          set -euo pipefail
          docker compose -p soat-runtime -f tests/docker-compose.smoke.yml -f tests/docker-compose.ci-override.yml up --build -d database ollama ollama-tool-choice formation-handler server worker

      - name: Verify SOAT health
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:50477/health >/tmp/soat-health.json; then
              cat /tmp/soat-health.json
              exit 0
            fi
            sleep 5
          done
          docker compose -p soat-runtime -f /tmp/soat/tests/docker-compose.smoke.yml -f /tmp/soat/tests/docker-compose.ci-override.yml logs --no-color --tail=400 server
          exit 1

      - name: Bootstrap authenticated local Ollama provider
        id: soat-bootstrap
        env:
          SOAT_BASE_URL: http://127.0.0.1:50477
        run: |
          set -euo pipefail
          USERNAME="ci-admin"
          BOOTSTRAP_CRED="$(openssl rand -hex 24)"

          # Bootstrap creates the first admin user; authentication is a separate login call.
          curl --fail --silent --show-error \
            -X POST "$SOAT_BASE_URL/api/v1/users/bootstrap" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg u "$USERNAME" --arg p "$BOOTSTRAP_CRED" \
              '{username:$u,password:$p}')" >/tmp/soat-bootstrap.json

          TOKEN="$(
            curl --fail --silent --show-error \
              -X POST "$SOAT_BASE_URL/api/v1/users/login" \
              -H "Content-Type: application/json" \
              -d "$(jq -nc --arg u "$USERNAME" --arg p "$BOOTSTRAP_CRED" \
                '{username:$u,password:$p}')" |
            jq -er '.token'
          )"

          PROJECT_ID="$(
            curl --fail --silent --show-error               -X POST "$SOAT_BASE_URL/api/v1/projects"               -H "Content-Type: application/json"               -H "Authorization: Bearer $TOKEN"               -d '{"name":"api-factory-runtime-smoke"}' |
            jq -er '.id'
          )"

          PROVIDER_ID="$(
            curl --fail --silent --show-error               -X POST "$SOAT_BASE_URL/api/v1/ai-providers"               -H "Content-Type: application/json"               -H "Authorization: Bearer $TOKEN"               -d "$(jq -nc --arg project "$PROJECT_ID"                 '{
                  project_id:$project,
                  name:"Local Ollama",
                  provider:"ollama",
                  base_url:"http://ollama-tool-choice:11434",
                  default_model:"qwen2.5:0.5b"
                }')" |
            jq -er '.id'
          )"

          echo "::add-mask::$TOKEN"
          echo "SOAT_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SOAT_AI_PROVIDER_ID=$PROVIDER_ID" >> "$GITHUB_ENV"
          echo "SOAT_PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"
          echo "Authenticated SOAT project/provider created: $PROJECT_ID / $PROVIDER_ID"

      - name: Verify API Factory authenticated probe
        env:
          SOAT_BASE_URL: http://127.0.0.1:50477
          SOAT_AI_PROVIDER_ID: ${{ env.SOAT_AI_PROVIDER_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createProviderAdapter} from "./AI-API-HUB/api-factory/provider.mjs";

          const adapter = createProviderAdapter({
            kind: "soat",
            baseUrl: process.env.SOAT_BASE_URL,
            credentialEnv: "SOAT_TOKEN",
            freePolicy: {
              zeroCostOnly: true,
              providerId: "ollama-local",
              accessClass: "local",
              freeStatus: "recurring",
              quotaBasis: "local-compute",
              hardStop: true,
              eligibilityGate: "local-runtime",
              tosRisk: "ok",
              sourceLastResearched: "2026-10-05",
              sourceUrl: "https://ollama.com"
            }
          });

          const result = await adapter.probe();
          console.log(JSON.stringify(result));
          await import("node:fs/promises").then((fs)=>fs.writeFile("/tmp/soat-probe.json",JSON.stringify(result,null,2)+"\n"));
          if (!result.ok || result.transport !== true || result.authorization !== true) {
            process.exit(1);
          }
          NODE

      - name: Verify API Factory real AI completion through SOAT and Ollama
        env:
          SOAT_BASE_URL: http://127.0.0.1:50477
          SOAT_AI_PROVIDER_ID: ${{ env.SOAT_AI_PROVIDER_ID }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {createProviderAdapter} from "./AI-API-HUB/api-factory/provider.mjs";

          const adapter = createProviderAdapter({
            kind: "soat",
            baseUrl: process.env.SOAT_BASE_URL,
            credentialEnv: "SOAT_TOKEN",
            freePolicy: {
              zeroCostOnly: true,
              providerId: "ollama-local",
              accessClass: "local",
              freeStatus: "recurring",
              quotaBasis: "local-compute",
              hardStop: true,
              eligibilityGate: "local-runtime",
              tosRisk: "ok",
              sourceLastResearched: "2026-10-05",
              sourceUrl: "https://ollama.com"
            }
          });

          const result = await adapter.execute({
            messages: [
              { role: "system", content: "Reply with a short factual answer." },
              { role: "user", content: "What is 2 + 2? Reply with just the number." }
            ],
            temperature: 0
          });

          const content = result?.choices?.[0]?.message?.content;
          assert.equal(typeof content, "string");
          assert.ok(content.trim().length > 0, "SOAT returned an empty completion");

          const evidence={ok:true,provider:"soat",provider_backend:"local-ollama-ci",completionChars:content.trim().length,completion:content.trim()};
          await import("node:fs/promises").then((fs)=>fs.writeFile("/tmp/soat-completion.json",JSON.stringify(evidence,null,2)+"\n"));
          console.log(JSON.stringify(evidence));
          NODE

      - name: Run official SOAT smoke suite
        working-directory: /tmp/soat
        run: |
          set -euo pipefail
          docker compose -p soat-official-smoke -f tests/docker-compose.smoke.yml run --rm smoke-test

      - name: Validate execution contract from verified SOAT evidence
        if: success()
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {createExecutionRecord,assertStateExit} from "./AI-API-HUB/api-factory/execution-contract.mjs";
          const completion=JSON.parse(fs.readFileSync("/tmp/soat-completion.json","utf8"));
          const probe=JSON.parse(fs.readFileSync("/tmp/soat-probe.json","utf8"));
          const record=createExecutionRecord({
            state:"VERIFY",
            artifacts:{verification:{health:true,authentication:true,provider_resolved:true,api_factory_probe:probe.ok===true,real_chat_completion:completion.ok===true,official_smoke_suite:true}},
            evidence:["soat-health","soat-authentication","api-factory-probe","real-chat-completion","official-soat-smoke"],
            metadata:{workflow:"SOAT Runtime Integration Smoke",soat_sha:process.env.SOAT_SHA,run_id:process.env.GITHUB_RUN_ID,commit:process.env.GITHUB_SHA}
          });
          assertStateExit(record);
          fs.writeFileSync("soat-execution-record.json",JSON.stringify(record,null,2)+"\n");
          console.log(JSON.stringify(record));
          NODE

      - name: Persist SOAT verification record
        if: success()
        run: |
          set -euo pipefail
          jq -n --arg run_id "$GITHUB_RUN_ID" --arg run_attempt "$GITHUB_RUN_ATTEMPT" --arg commit "$GITHUB_SHA" --arg workflow "SOAT Runtime Integration Smoke" --arg soat_sha "$SOAT_SHA" --arg project_id "$SOAT_PROJECT_ID" --arg provider_id "$SOAT_AI_PROVIDER_ID" --slurpfile health /tmp/soat-health.json --slurpfile probe /tmp/soat-probe.json --slurpfile completion /tmp/soat-completion.json '{schema:"soat-verification-record/v1",evidence_level:"provider",scope:"ci-pinned-local-runtime",workflow:$workflow,run_id:$run_id,run_attempt:$run_attempt,commit:$commit,soat_sha:$soat_sha,project_id:$project_id,provider_id:$provider_id,gates:{health:true,authentication:true,provider_resolved:true,api_factory_probe:true,real_chat_completion:true,official_smoke_suite:true},observations:{health:$health[0],probe:$probe[0],completion:$completion[0]},production_status:"not_proven"}' > soat-verification-record.json
          cat soat-verification-record.json

      - name: Upload SOAT verification record
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: soat-verification-${{ github.run_id }}
          path: soat-verification-record.json
          if-no-files-found: error

      - name: Collect runtime diagnostics
        if: failure()
        working-directory: /tmp/soat
        run: |
          docker compose -p soat-official-smoke -f tests/docker-compose.smoke.yml logs --no-color --tail=500 server worker ollama ollama-tool-choice || true
          docker compose -p soat-runtime -f tests/docker-compose.smoke.yml -f tests/docker-compose.ci-override.yml logs --no-color --tail=500 server worker ollama ollama-tool-choice || true

      - name: Cleanup SOAT runtime
        if: always()
        working-directory: /tmp/soat
        run: |
          docker compose -p soat-official-smoke -f tests/docker-compose.smoke.yml down --volumes --remove-orphans || true
          docker compose -p soat-runtime -f tests/docker-compose.smoke.yml -f tests/docker-compose.ci-override.yml down --volumes --remove-orphans || true
