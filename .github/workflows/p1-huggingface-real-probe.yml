name: P1 Hugging Face Real Probe

on:
  push:
    branches: [main]
    paths:
      - 'AI-API-HUB/api-factory/free-provider-probe.mjs'
      - 'AI-API-HUB/api-factory/package.json'
      - '.github/workflows/p1-huggingface-real-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  huggingface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    env:
      PROVIDER: huggingface_inference
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check provider configuration
        id: config
        shell: bash
        run: |
          if [ -n "$HF_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - name: Probe real completion
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -o pipefail
          node free-provider-probe.mjs | tee provider-evidence.json
      - name: Validate and publish evidence
        if: steps.config.outputs.configured == 'true'
        run: node -e 'import fs from "node:fs"; import {assertProviderEvidence} from "./provider-evidence.mjs"; const e=JSON.parse(fs.readFileSync("provider-evidence.json","utf8")); assertProviderEvidence(e); console.log("provider evidence gate: PASS");'

      - name: Upload provider evidence
        if: steps.config.outputs.configured == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: p1-huggingface-provider-evidence-${{ github.run_id }}
          path: AI-API-HUB/api-factory/provider-evidence.json
          if-no-files-found: error
