name: Railway Token Access Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  railway-token-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 778678c6-dd6e-40fe-a33e-63d0953ab7d4
      RAILWAY_ENVIRONMENT: production
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify workspace token can read the target project
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN}"
          unset RAILWAY_TOKEN
          railway status --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --json > /tmp/railway-status.json
          jq 'if type == "object" then {topLevelKeys:(keys), projectId:(.project.id // .projectId // null), environmentId:(.environment.id // .environmentId // null), project:(.project | if type=="object" then {id,name,workspaceId} else . end), environment:(.environment | if type=="object" then {id,name} else . end), services:(.services // [] | if type=="array" then map(if type=="object" then {id,name,status} else . end) else . end), databases:(.databases // [] | if type=="array" then map(if type=="object" then {id,name,type} else . end) else . end), volumes:(.volumes // [] | if type=="array" then map(if type=="object" then {id,name} else . end) else . end)} else {payloadType:type} end' /tmp/railway-status.json
