name: Railway Token Access Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  railway-token-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 778678c6-dd6e-40fe-a33e-63d0953ab7d4
      RAILWAY_ENVIRONMENT: production
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify workspace token can read the target project
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN}"
          unset RAILWAY_TOKEN
          railway status --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --json > /tmp/railway-status.json
          jq 'if type == "object" then {topLevelKeys:(keys), project:(.project // null), environment:(.environment // null), projectId:(.projectId // null), environmentId:(.environmentId // null), serviceCount:(if (.services|type) == "array" then (.services|length) else null end)} else {payloadType:type} end' /tmp/railway-status.json
