name: Railway Token Access Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  railway-token-access:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: 778678c6-dd6e-40fe-a33e-63d0953ab7d4
      RAILWAY_ENVIRONMENT: production
    steps:
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Verify workspace token can read the target project
        run: |
          set -euo pipefail
          test -n "${RAILWAY_API_TOKEN}"
          unset RAILWAY_TOKEN
          railway status --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --json > /tmp/railway-status.json
          jq '{projectId:.id,projectName:.name,workspaceId:.workspaceId,productionEnvironmentId:(.environments.edges[] | .node | select(.name=="production") | .id),services:(.services.edges | map(.node | {id,name})),databases:[],volumes:[]}' /tmp/railway-status.json

      - name: Test SOAT service creation without touching existing services
        run: |
          set -euo pipefail
          PRODUCTION_ENVIRONMENT_ID="$(jq -r '.environments.edges[]?.node | select(.name=="production") | .id' /tmp/railway-status.json)"
          test -n "${PRODUCTION_ENVIRONMENT_ID}"
          railway link --project "${RAILWAY_PROJECT_ID}" --environment "${PRODUCTION_ENVIRONMENT_ID}" --json
          railway add --service soat --yes --json > /tmp/soat-add.json
          cat /tmp/soat-add.json
