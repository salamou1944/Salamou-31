name: Free Provider Real Probe

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to probe
        required: true
        type: choice
        options:
          - groq
          - openrouter
          - huggingface_inference
      model:
        description: Optional model override
        required: false
        type: string
      model_free_confirmed:
        description: Confirm the exact Hugging Face model/provider has been verified as zero-cost in official pricing
        required: false
        type: boolean
        default: false

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    env:
      PROVIDER: ${{ inputs.provider }}
      PROVIDER_MODEL: ${{ inputs.model }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_MODEL_FREE_CONFIRMED: ${{ inputs.model_free_confirmed }}
      HUGGINGFACE_INFERENCE_BILLING_TIER: ${{ vars.HUGGINGFACE_INFERENCE_BILLING_TIER }}
      GROQ_BILLING_TIER: ${{ vars.GROQ_BILLING_TIER }}
      OPENROUTER_BILLING_TIER: ${{ vars.OPENROUTER_BILLING_TIER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe provider
        run: npm run provider:probe
