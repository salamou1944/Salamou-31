name: Collection SecLab Taskflow Agent Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/collection-seclab-taskflow-agent-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collection-seclab-taskflow-agent-runtime
  cancel-in-progress: true

env:
  TASKFLOW_AGENT_REF: cdcb6fcd65c31f0fe934bed3248034b1c408eedf

jobs:
  runtime-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4

      - name: Checkout pinned Taskflow Agent
        uses: actions/checkout@v4
        with:
          repository: GitHubSecurityLab/seclab-taskflow-agent
          ref: ${{ env.TASKFLOW_AGENT_REF }}
          path: /tmp/seclab-taskflow-agent

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        working-directory: /tmp/seclab-taskflow-agent
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Deterministic test gate
        working-directory: /tmp/seclab-taskflow-agent
        run: |
          pytest -q tests/test_api_endpoint_config.py tests/test_cli.py tests/test_cli_app.py

      - name: CLI contract
        working-directory: /tmp/seclab-taskflow-agent
        run: |
          seclab-taskflow-agent --help >/tmp/taskflow-help.txt
          grep -q -- "-t" /tmp/taskflow-help.txt
          grep -q -- "-p" /tmp/taskflow-help.txt
          echo "TASKFLOW_AGENT_CLI_CONTRACT_OK"

      - name: Compile-only taskflow smoke
        working-directory: /tmp/seclab-taskflow-agent
        run: |
          python -m compileall -q src
          python -m seclab_taskflow_agent --help >/tmp/taskflow-module-help.txt
          echo "TASKFLOW_AGENT_RUNTIME_OK"

      - name: Emit evidence
        if: success()
        run: |
          mkdir -p COLLECTION/WORK_READY
          cat > COLLECTION/WORK_READY/2026-10-06-GitHubSecurityLab-seclab-taskflow-agent-runtime.json <<'JSON'
          {
            "schema": "collection-runtime-evidence/v1",
            "candidate": "GitHubSecurityLab/seclab-taskflow-agent",
            "source_ref": "cdcb6fcd65c31f0fe934bed3248034b1c408eedf",
            "license": "MIT",
            "gates": {
              "installation": true,
              "deterministic_tests": true,
              "cli_contract": true,
              "compile_smoke": true
            },
            "provider_execution": "NOT_ATTEMPTED",
            "verified": true,
            "promotion": "READY_TO_USE"
          }
          JSON

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seclab-taskflow-agent-runtime-evidence
          path: COLLECTION/WORK_READY/2026-10-06-GitHubSecurityLab-seclab-taskflow-agent-runtime.json
          if-no-files-found: ignore
