name: OpenAI API Real Probe

on:
  push:
    paths:
      - 'AI-API-HUB/api-factory/openai-provider-probe.mjs'
      - '.github/workflows/openai-real-probe.yml'
      - 'AI-API-HUB/api-factory/package.json'
  workflow_dispatch:

jobs:
  openai:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_PAID_PROVIDER_PROBES == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    env:
      OPENAI_API_KEY: ${{ secrets.chatgpt_API_Key }}
      OPENAI_BILLING_TIER: ${{ vars.OPENAI_BILLING_TIER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe OpenAI API
        run: node openai-provider-probe.mjs
