name: API Factory Test

on:
  push:
    paths:
      - 'AI-API-HUB/api-factory/**'
      - '.github/workflows/api-factory-test.yml'
  pull_request:
    paths:
      - 'AI-API-HUB/api-factory/**'
      - '.github/workflows/api-factory-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AI-API-HUB/api-factory/package.json
      - run: npm install --ignore-scripts
      - run: npm test
