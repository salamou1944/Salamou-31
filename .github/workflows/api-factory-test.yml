name: API Factory Test

on:
  push:
    paths:
      - 'AI-API-HUB/api-factory/**'
      - 'AI-API-HUB/FREE-PROVIDER-POLICY.md'
      - 'AI-API-HUB/free-provider-policy-fixture.json'
      - 'AI-API-HUB/test-free-provider-policy.mjs'
      - '.github/workflows/api-factory-test.yml'
  pull_request:
    paths:
      - 'AI-API-HUB/api-factory/**'
      - 'AI-API-HUB/FREE-PROVIDER-POLICY.md'
      - 'AI-API-HUB/free-provider-policy-fixture.json'
      - 'AI-API-HUB/test-free-provider-policy.mjs'
      - '.github/workflows/api-factory-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - name: Install Sherlock
        run: python -m pip install --user sherlock-project
      - name: Verify Sherlock installation
        run: python -m sherlock_project --version
      - name: Verify free-provider policy
        working-directory: AI-API-HUB
        run: node test-free-provider-policy.mjs
      - run: npm test
