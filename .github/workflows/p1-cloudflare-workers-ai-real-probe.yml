name: P1 Cloudflare Workers AI Real Probe

on:
  push:
    branches: [main]
    paths:
      - 'AI-API-HUB/api-factory/cloudflare-workers-ai-probe.mjs'
      - '.github/workflows/p1-cloudflare-workers-ai-real-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check provider configuration
        id: config
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "configured=true" >> "$GITHUB_OUTPUT"; else echo "configured=false" >> "$GITHUB_OUTPUT"; fi
      - name: Probe Cloudflare Workers AI
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -o pipefail
          node cloudflare-workers-ai-probe.mjs | tee provider-evidence.json
      - name: Validate provider evidence
        if: steps.config.outputs.configured == 'true'
        run: node -e 'import fs from "node:fs"; import {assertProviderEvidence} from "./provider-evidence.mjs"; assertProviderEvidence(JSON.parse(fs.readFileSync("provider-evidence.json","utf8"))); console.log("provider evidence gate: PASS");'

      - name: Upload provider evidence
        if: steps.config.outputs.configured == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: p1-cloudflare-provider-evidence-${{ github.run_id }}
          path: AI-API-HUB/api-factory/provider-evidence.json
          if-no-files-found: error
