name: P1 Cloudflare Workers AI Real Probe

on:
  push:
    branches: [main]
    paths:
      - 'AI-API-HUB/api-factory/cloudflare-workers-ai-probe.mjs'
      - '.github/workflows/p1-cloudflare-workers-ai-real-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Cloudflare Workers AI
        run: node cloudflare-workers-ai-probe.mjs
