name: SOAT Production Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soat-production-verification
  cancel-in-progress: false

jobs:
  production-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOAT_BASE_URL: ${{ secrets.SOAT_BASE_URL }}
      SOAT_API_KEY: ${{ secrets.SOAT_API_KEY }}
      SOAT_AI_PROVIDER_ID: ${{ secrets.SOAT_AI_PROVIDER_ID }}
    steps:
      - name: Checkout Salamou-31
        uses: actions/checkout@v4

      - name: Require production verification inputs
        run: |
          set -euo pipefail
          for name in SOAT_BASE_URL SOAT_API_KEY SOAT_AI_PROVIDER_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 2
            fi
          done
          case "$SOAT_BASE_URL" in
            https://*) ;;
            *) echo "::error::SOAT_BASE_URL must use HTTPS"; exit 2 ;;
          esac

      - name: Verify production health and authentication
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 15 \
            "$SOAT_BASE_URL/health" > /tmp/soat-health.json
          cat /tmp/soat-health.json

          curl --fail --silent --show-error --max-time 15 \
            -H "Authorization: Bearer $SOAT_API_KEY" \
            "$SOAT_BASE_URL/api/v1/projects" > /tmp/soat-projects.json
          jq -e 'type == "object" or type == "array"' /tmp/soat-projects.json >/dev/null

      - name: Verify API Factory production probe
        run: |
          set -euo pipefail
          node AI-API-HUB/api-factory/soat-probe.mjs | tee /tmp/soat-probe.json
          jq -e '.ok == true and .transport == true and .authorization == true' /tmp/soat-probe.json >/dev/null

      - name: Verify real production chat completion
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import {createProviderAdapter} from "./AI-API-HUB/api-factory/provider.mjs";

          const adapter=createProviderAdapter({
            kind:"soat",
            baseUrl:process.env.SOAT_BASE_URL,
            credentialEnv:"SOAT_API_KEY",
            freePolicy:{
              zeroCostOnly:true,
              providerId:"soat-production",
              accessClass:"self-hosted",
              freeStatus:"recurring",
              quotaBasis:"self-hosted",
              hardStop:true,
              eligibilityGate:"production-runtime",
              tosRisk:"ok",
              sourceLastResearched:"2026-10-05",
              sourceUrl:"https://github.com/ttoss/soat"
            }
          });

          const started=Date.now();
          let result;
          try {
            result=await adapter.execute({
              messages:[
                {role:"system",content:"Reply with only the number."},
                {role:"user",content:"What is 2 + 2?"}
              ],
              temperature:0
            });
          } catch (error) {
            const failure={ok:false,error:String(error?.message||error),durationMs:Date.now()-started};
            fs.writeFileSync("/tmp/soat-production-completion.json",JSON.stringify(failure,null,2)+"\n");
            console.error(JSON.stringify(failure));
            process.exit(1);
          }

          const content=result?.choices?.[0]?.message?.content;
          const usage=result?.usage ?? null;
          if(typeof content!=="string" || content.trim().length===0) {
            throw new Error("Production SOAT completion returned no content");
          }

          const evidence={
            ok:true,
            provider:"soat",
            scope:"production-runtime",
            completion:content.trim(),
            completionChars:content.trim().length,
            usage,
            durationMs:Date.now()-started,
            errorBehavior:"success-path-observed"
          };
          fs.writeFileSync("/tmp/soat-production-completion.json",JSON.stringify(evidence,null,2)+"\n");
          console.log(JSON.stringify(evidence));
          NODE

      - name: Build production verification record
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const health=JSON.parse(fs.readFileSync("/tmp/soat-health.json","utf8"));
          const probe=JSON.parse(fs.readFileSync("/tmp/soat-probe.json","utf8"));
          const completion=JSON.parse(fs.readFileSync("/tmp/soat-production-completion.json","utf8"));

          const record={
            schema:"soat-verification-record/v2",
            evidence_level:"production",
            scope:"production-runtime",
            workflow:"SOAT Production Verification",
            run_id:process.env.GITHUB_RUN_ID,
            run_attempt:process.env.GITHUB_RUN_ATTEMPT,
            commit:process.env.GITHUB_SHA,
            gates:{
              health:true,
              authentication:true,
              provider_resolved:true,
              api_factory_probe:probe.ok===true,
              real_chat_completion:completion.ok===true,
              usage_recorded:completion.usage!==null,
              error_behavior_recorded:true
            },
            observations:{
              health,
              probe,
              completion
            },
            production_status:"proven"
          };

          const failed=Object.entries(record.gates).filter(([,ok])=>ok!==true).map(([name])=>name);
          if(failed.length) {
            console.error(JSON.stringify({ok:false,failed}));
            process.exit(1);
          }
          fs.writeFileSync("soat-production-verification-record.json",JSON.stringify(record,null,2)+"\n");
          console.log(JSON.stringify(record));
          NODE

      - name: Upload production verification record
        uses: actions/upload-artifact@v4
        with:
          name: soat-production-verification-${{ github.run_id }}
          path: soat-production-verification-record.json
          if-no-files-found: error
