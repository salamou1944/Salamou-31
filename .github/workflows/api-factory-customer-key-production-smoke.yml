name: API Factory Customer Key Production Lifecycle Smoke

on:
  push:
    branches:
      - fix/api-factory-live-storage-readiness-2026-10-20
    paths:
      - ".github/workflows/api-factory-customer-key-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-key-lifecycle:
    name: production-customer-key-create-use-quota-revoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://salamou-31-api-factory.onrender.com
      FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
    steps:
      - name: Wait for merged customer-key runtime to be live
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FACTORY_API_KEY:-}" || { echo 'FACTORY_API_KEY repository secret is missing'; exit 1; }
          ready=0
          for attempt in $(seq 1 36); do
            health="$(curl --silent --show-error --connect-timeout 5 --max-time 15 -o /tmp/health.json -w '%{http_code}' "$BASE_URL/health" || true)"
            if [ "$health" = "200" ]; then
              probe="$(curl --silent --show-error --connect-timeout 5 --max-time 15 -X POST -H "x-api-key: $FACTORY_API_KEY" -H 'content-type: application/json' --data '{"label":"probe","quotaLimit":0}' -o /tmp/probe.json -w '%{http_code}' "$BASE_URL/v1/factory/customer-keys" || true)"
              if [ "$probe" = "400" ] && node -e 'const x=require("/tmp/probe.json"); process.exit(x?.code==="INVALID_CUSTOMER_KEY_INPUT"?0:1)' 2>/dev/null; then ready=1; break; fi
              echo "Customer-key runtime probe attempt $attempt: HTTP ${probe:-no-response}; waiting for production rollout"
            else echo "Production health attempt $attempt returned ${health:-no-response}"; fi
            sleep 5
          done
          test "$ready" = "1"
          echo 'Production customer-key route: PASS (new runtime identified without creating a key)'

      - name: Verify production customer-key lifecycle without exposing key material
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.BASE_URL;
          const adminKey = process.env.FACTORY_API_KEY;
          const headers = key => ({ "content-type": "application/json", "x-api-key": key });
          async function call(path, { method = "GET", key = adminKey, body } = {}) {
            const response = await fetch(base + path, { method, headers: headers(key), ...(body === undefined ? {} : { body: JSON.stringify(body) }), signal: AbortSignal.timeout(45000) });
            const raw = await response.text(); let data = {}; try { data = raw ? JSON.parse(raw) : {}; } catch {}
            return { status: response.status, data };
          }
          let keyId = null, customerKey = null, revoked = false;
          const failures = [];
          try {
            const created = await call("/v1/factory/customer-keys", { method: "POST", body: { label: "production-smoke-" + (process.env.GITHUB_RUN_ID || Date.now()), quotaLimit: 1 } });
            if (created.status !== 201 || created.data?.ok !== true || typeof created.data.apiKey !== "string" || !/^sal31_[A-Za-z0-9_-]{43}$/.test(created.data.apiKey) || !created.data?.key?.id) throw new Error("customer-key creation failed: HTTP " + created.status + " (" + (created.data?.code || "unexpected_response") + ")");
            customerKey = created.data.apiKey; keyId = created.data.key.id;
            process.stdout.write("::add-mask::" + customerKey + "\n");
            console.log("Production customer key creation: PASS (raw key masked; not printed)");
            const first = await call("/v1/factory/research/username", { method: "POST", key: customerKey, body: { username: "github", timeoutMs: 30000 } });
            if (first.status !== 200 || first.data?.ok !== true || first.data?.source !== "sherlock") failures.push("first real research request failed: HTTP " + first.status + " (" + (first.data?.code || "unexpected_response") + ")");
            else console.log("Production real Sherlock research: PASS (HTTP 200)");
            const second = await call("/v1/factory/research/username", { method: "POST", key: customerKey, body: { username: "github", timeoutMs: 30000 } });
            if (second.status !== 429 || second.data?.code !== "CUSTOMER_QUOTA_EXCEEDED") failures.push("quota was not enforced: HTTP " + second.status);
            else console.log("Production quota enforcement: PASS (second request HTTP 429)");
            const usage = await call("/v1/factory/customer-keys/" + keyId + "/usage");
            if (usage.status !== 200 || usage.data?.key?.usageCount !== 1 || usage.data?.key?.quotaLimit !== 1) failures.push("durable usage mismatch: HTTP " + usage.status);
            else console.log("Production durable usage: PASS (usageCount=1, quotaLimit=1)");
            const rev = await call("/v1/factory/customer-keys/" + keyId + "/revoke", { method: "POST", body: {} });
            if (rev.status !== 200 || rev.data?.key?.status !== "revoked") failures.push("revocation failed: HTTP " + rev.status);
            else { revoked = true; console.log("Production customer key revocation: PASS"); }
            const after = await call("/v1/factory/research/username", { method: "POST", key: customerKey, body: { username: "github", timeoutMs: 30000 } });
            if (after.status !== 401) failures.push("revoked key was not rejected: HTTP " + after.status);
            else console.log("Production post-revocation denial: PASS (HTTP 401)");
          } finally {
            if (keyId && !revoked) { try { const cleanup = await call("/v1/factory/customer-keys/" + keyId + "/revoke", { method: "POST", body: {} }); if (cleanup.status === 200) console.log("Cleanup: temporary production customer key revoked"); else failures.push("cleanup revocation returned HTTP " + cleanup.status); } catch { failures.push("cleanup revocation request failed"); } }
          }
          if (failures.length) { for (const failure of failures) console.error("FAIL: " + failure); process.exit(1); }
          console.log("RESULT: PRODUCTION CUSTOMER KEY LIFECYCLE VERIFIED");
          NODE
