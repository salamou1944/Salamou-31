name: P1 Mistral Real Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'AI-API-HUB/api-factory/free-provider-probe.mjs'
      - 'AI-API-HUB/api-factory/package.json'
      - 'AI-API-HUB/api-factory/provider-evidence.mjs'
      - '.github/workflows/p1-mistral-real-probe.yml'

permissions:
  contents: read

jobs:
  mistral:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    env:
      PROVIDER: mistral
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check provider configuration
        id: config
        shell: bash
        run: |
          if [ -n "$MISTRAL_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Probe Mistral real completion
        if: steps.config.outputs.configured == 'true'
        shell: bash
        run: |
          set -o pipefail
          node free-provider-probe.mjs | tee provider-evidence.json
      - name: Validate provider evidence
        if: steps.config.outputs.configured == 'true'
        run: |
          node -e 'import fs from "node:fs"; import {assertProviderEvidence} from "./provider-evidence.mjs"; assertProviderEvidence(JSON.parse(fs.readFileSync("provider-evidence.json","utf8"))); console.log("provider evidence gate: PASS");'
      - name: Upload provider evidence
        if: steps.config.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: p1-mistral-provider-evidence-${{ github.run_id }}
          path: AI-API-HUB/api-factory/provider-evidence.json
          if-no-files-found: error
