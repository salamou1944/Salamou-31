name: P1 Mistral Real Probe

on:
  push:
    branches: [main]
    paths:
      - 'AI-API-HUB/api-factory/free-provider-probe.mjs'
      - 'AI-API-HUB/api-factory/package.json'
      - '.github/workflows/p1-mistral-real-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  mistral:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: AI-API-HUB/api-factory
    env:
      PROVIDER: mistral
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Mistral real completion
        run: node free-provider-probe.mjs

      - name: Upload provider evidence
        if: steps.config.outputs.configured == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: p1-mistral-provider-evidence-${{ github.run_id }}
          path: AI-API-HUB/api-factory/provider-evidence.json
          if-no-files-found: error
